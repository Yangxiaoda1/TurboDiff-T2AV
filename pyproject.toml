[project]
name = "turbodiffusion"
description = "TurboDiffusion: video generation acceleration framework that could accelerate end-to-end video generation by 100-205x with negligible video quality loss."
version = "1.0.0"
authors = [
  { name = "Jintao Zhang" },
  { name = "Kaiwen Zheng" },
  { name = "Kai Jiang" },
  { name = "Haoxu Wang" },
]
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]

dependencies = [
  "einops",
  "numpy",
  "pillow",
  "loguru",
  "imageio[ffmpeg]",
  "pandas",
  "PyYAML",
  "omegaconf",
  "attrs",
  "fvcore",
  "ftfy",
  "regex",
  "transformers",
  "nvidia-ml-py",
  "prompt-toolkit>=3.0",
  "rich>=13.0",
  "megatron-core>=0.16.0,<0.17",
  "hydra-core>=1.3.2,<2",
  "wandb>=0.25.1,<0.26",
  "webdataset>=1.0.2,<2",
]

[build-system]
requires = [
  "setuptools>=62",
  "wheel>=0.38",
  "packaging>=21",
  "ninja",
]
build-backend = "setuptools.build_meta"

[project.scripts]
turbodiffusion-serve = "turbodiffusion.serve.tui:main"

[project.urls]
Homepage = "https://github.com/thu-ml/TurboDiffusion"
Repository = "https://github.com/thu-ml/TurboDiffusion"

[tool.pixi.workspace]
channels = ["nvidia", "conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
pip = ">=26.0.1,<27"
setuptools = ">=82.0.1,<83"
wheel = ">=0.46.3,<0.47"
packaging = ">=26.0,<27"
ninja = ">=1.13.2,<2"
git = ">=2.53.0,<3"

numpy = ">=2.4.2,<3"
pytz = ">=2026.1.post1,<2027"
pyyaml = ">=6.0.3,<7"
tqdm = ">=4.67.3,<5"
einops = ">=0.8.2,<0.9"
omegaconf = ">=2.3.0,<3"

gcc_linux-64 = "13.*"
gxx_linux-64 = "13.*"

cuda-nvcc = { version = "12.8.*", channel = "nvidia" }
cuda-cudart-dev = { version = "12.8.*", channel = "nvidia" }
cuda-nvrtc = { version = "12.8.*", channel = "nvidia" }
cuda-nvrtc-dev = { version = "12.8.*", channel = "nvidia" }
cuda-nvtx = { version = "12.8.*", channel = "nvidia" }
cuda-nvtx-dev = { version = "12.8.*", channel = "nvidia" }

cudnn = { version = "*", channel = "nvidia" }
libcusparse-dev = { version = "*", channel = "nvidia" }
libcublas-dev = { version = "*", channel = "nvidia" }
libcusolver-dev = { version = "*", channel = "nvidia" }
nccl = { version = "*", channel = "nvidia" }


[tool.pixi.activation.env]
CUDA_HOME = "/home/jovyan/codes/turbodiff/new_Turbo/TurboDiff-T2AV/.pixi/envs/default"
CUDA_PATH = "/home/jovyan/codes/turbodiff/new_Turbo/TurboDiff-T2AV/.pixi/envs/default"